name: Build Windows executable

# PyInstaller cannot cross-compile, so the .exe is built on a Windows runner.
# Trigger manually (Actions tab) or by pushing a v* tag.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build executable
        run: pyinstaller --noconfirm PhotoRecognition.spec

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PhotoRecognition-windows
          path: dist/PhotoRecognition.exe
          if-no-files-found: error
          retention-days: 30
